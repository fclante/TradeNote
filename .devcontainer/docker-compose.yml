services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - 8080:8080
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://tradenote:tradenote@mongo:27017/tradenote?authSource=admin"
      TRADENOTE_DATABASE: tradenote
      APP_ID: devcontainer
      MASTER_KEY: devcontainer
      TRADENOTE_PORT: 8080
      NODE_ENV: dev
      ANALYTICS_OFF: "true"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - 27018:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: tradenote
      MONGO_INITDB_ROOT_PASSWORD: tradenote
      MONGO_INITDB_DATABASE: tradenote

volumes:
  mongo-data:
